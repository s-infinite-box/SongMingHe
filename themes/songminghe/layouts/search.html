{{ define "main" }}{{ $posts := where site.RegularPages "Section" "posts" }}<div class="page-heading"><div><p class="eyebrow">找到感兴趣的内容</p><h1>搜索文章</h1><p>支持搜索标题、正文、分类和标签。</p></div></div><div class="search-box">{{ partial "icon.html" "search" }}<input id="search-input" type="search" placeholder="试试 Linux、Rust 或学习方法…" aria-label="搜索文章" autocomplete="off"><span id="search-count">{{ len $posts }} 篇</span></div><div class="post-list" id="search-results">{{ range $posts.ByDate.Reverse }}{{ partial "card.html" (dict "page" . "pinned" false) }}{{ end }}</div><p id="search-empty" hidden>没有找到相关文章，试试其他关键词。</p><script type="application/json" id="search-data">{{ $entries := slice }}{{ range $posts }}{{ $entries = $entries | append (dict "url" .RelPermalink "text" (printf "%s %s %s %s" .Title .Plain (delimit .Params.tags " ") (delimit .Params.categories " "))) }}{{ end }}{{ $entries | jsonify | safeJS }}</script>{{ end }}
