# Hugo 站点配置
# 文档：https://gohugo.io/getting-started/configuration/
# 主题：https://stack.jimmycai.com/config/

baseURL: https://s-infinite-box.github.io/SongMingHe/
title: 宋明河的博客
theme: hugo-theme-stack

# 语言：语言键用 zh 以匹配 Stack 的 i18n/zh.toml
defaultContentLanguage: zh
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
hasCJKLanguage: true # 按中文方式统计字数与阅读时长
timeZone: Asia/Shanghai

enableRobotsTXT: true
enableEmoji: true
capitalizeListTitles: false # 标签/分类页标题保持原样，不自动首字母大写
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 6

# 分类法：文章 frontmatter 中的 categories / tags
taxonomies:
  category: categories
  tag: tags

# URL 结构：文章 /posts/<目录名>/，独立页面（归档、搜索、关于）直接挂在根路径下
permalinks:
  page: /:slug/

# 输出格式：文章页额外输出 Markdown（/posts/<slug>/index.md），供"复制 Markdown"按钮读取
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    notAlternative: true
outputs:
  page: [HTML, markdown]

markup:
  goldmark:
    renderer:
      unsafe: true # 允许在 Markdown 中直接写 HTML
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: true

# 左侧栏菜单：主页 / 归档 / 搜索 / 关于 由各页面 frontmatter 中的 menu.main 声明
# 这里只放不对应具体页面的入口
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: -80
      params:
        icon: archives
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/s-infinite-box
      params:
        icon: brand-github
        newTab: true
    - identifier: email
      name: 邮箱
      url: mailto:MingHe.Song@hotmail.com
      params:
        icon: mail

params:
  mainSections: [posts]
  rssFullContent: true
  favicon: ""

  footer:
    since: 2024
    customText: ""

  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02 15:04"

  sidebar:
    compact: false
    emoji: ""
    subtitle: 您好！欢迎来到我的博客
    avatar: img/avatar.jpg

  article:
    headingAnchor: false
    math: false
    toc: true
    readingTime: true
    list:
      showTags: true
    license:
      enabled: false

  # 右侧栏小组件：首页与文章页
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 20
    page:
      - type: toc

  colorScheme:
    toggle: true # 左侧栏底部"暗色模式"开关
    default: auto

  imageProcessing:
    autoOrient: false
    content:
      enabled: true
    thumbnail:
      enabled: true

  cookies:
    enabled: false

  # 评论：giscus（GitHub Discussions），配置生成自 https://giscus.app
  # 主题内置了配色联动：切换暗色模式时会通知 giscus iframe
  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: s-infinite-box/SongMingHe
      repoID: R_kgDOM4eCsw
      category: Announcements
      categoryID: DIC_kwDOM4eCs84DE_rT
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      lightTheme: light
      darkTheme: dark
      lang: zh-CN
      loading: lazy

  opengraph:
    twitter:
      site: ""
      card: summary_large_image
