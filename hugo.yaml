# 宋明河个人博客；文章和配图仍由原仓库维护。
baseURL: https://s-infinite-box.github.io/
title: 宋明河
theme: songminghe
defaultContentLanguage: zh
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
hasCJKLanguage: true
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableEmoji: true
capitalizeListTitles: false
buildDrafts: false
buildFuture: false

# 显式更新时间优先，其次使用文章最后一次 Git 提交。
enableGitInfo: true
frontmatter:
  lastmod: [lastmod, ':git', date, publishDate]

taxonomies:
  category: categories
  tag: tags
  series: series
permalinks:
  page: /:slug/
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    notAlternative: true
outputs:
  home: [HTML, RSS]
  page: [HTML, markdown]
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
  tableOfContents:
    startLevel: 1
    endLevel: 4
    ordered: false

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
      params: {icon: home}
    - identifier: latest
      name: 最新文章
      url: /latest/
      weight: 2
      params: {icon: clock}
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 3
      params: {icon: archives}
    - identifier: search
      name: 搜索
      url: /search/
      weight: 4
      params: {icon: search}
    - identifier: about
      name: 关于
      url: /about/
      weight: 5
      params: {icon: user}
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/s-infinite-box
      weight: 1
      params: {icon: github, newTab: true}
    - identifier: email
      name: 邮箱
      url: mailto:mh.song@hotmail.com
      weight: 2
      params: {icon: mail}
    - identifier: csdn
      name: CSDN
      url: https://blog.csdn.net/2501_90571811?type=blog
      weight: 3
      params: {icon: csdn, newTab: true}
    - identifier: zhihu
      name: 知乎
      url: https://www.zhihu.com/people/yu-luo-chuang-tai-13/posts
      weight: 4
      params: {icon: zhihu, newTab: true}

params:
  mainSections: [posts]
  description: 技术实践、学习记录与日常思考
  rssFullContent: true
  favicon: img/avatar-favicon-round.ico
  article:
    toc: true
  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: s-infinite-box/s-infinite-box.github.io
      repoID: R_kgDOM4eCsw
      category: Announcements
      categoryID: DIC_kwDOM4eCs84DE_rT
      mapping: specific
      # 保留原 pathname 的讨论检索词，迁移地址后仍关联原评论。
      termPrefix: SongMingHe/
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      lightTheme: light
      darkTheme: dark
      lang: zh-CN
      loading: lazy
